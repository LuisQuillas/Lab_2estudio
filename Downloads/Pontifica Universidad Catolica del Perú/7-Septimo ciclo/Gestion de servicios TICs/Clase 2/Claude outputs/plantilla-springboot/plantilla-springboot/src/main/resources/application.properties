spring.application.name=plantilla

# ================= BASE DE DATOS (MySQL) =================
# CAMBIA AQUI el nombre de la base de datos (ahora dice: midb)
spring.datasource.url=jdbc:mysql://localhost:3306/midb?serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true
# CAMBIA AQUI tu usuario de MySQL (normalmente root)
spring.datasource.username=root
# CAMBIA AQUI tu password de MySQL
spring.datasource.password=Brenda123.

# Hibernate CREA/ACTUALIZA las tablas solo, a partir de tus @Entity.
# (Asi solo necesitas crear la BASE DE DATOS vacia, no las tablas.)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
