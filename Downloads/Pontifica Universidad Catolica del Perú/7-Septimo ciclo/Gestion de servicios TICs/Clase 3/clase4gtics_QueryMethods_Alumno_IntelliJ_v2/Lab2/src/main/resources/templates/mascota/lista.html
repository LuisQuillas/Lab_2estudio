<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Mascotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h2 class="pb-2 pt-2 border-bottom">Lista de Mascotas</h2>

    <table class="table table-sm table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Especie</th>
            <th>Raza</th>
            <th>Edad</th>
            <th>Nombre del dueño</th>
            <th>Teléfono</th>
            <th>Estado</th>
            <th></th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="mascota : ${listaMascotas}">
            <td th:text="${mascota.id}"></td>
            <td th:text="${mascota.nombre}"></td>
            <td th:text="${mascota.especie}"></td>
            <td th:text="${mascota.raza}"></td>
            <td th:text="${mascota.edad}"></td>
            <td th:text="${mascota.nombreDueno}"></td>
            <td th:text="${mascota.telefono}"></td>
            <td th:text="${mascota.estado}"></td>
            <td><a class="btn btn-primary btn-sm" th:href="@{'/mascota/editar?id=' + ${mascota.id}}">Editar</a></td>
            <td><a class="btn btn-danger btn-sm" th:href="@{'/mascota/borrar?id=' + ${mascota.id}}">Eliminar</a></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
